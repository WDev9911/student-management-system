<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6f42c1;
            --secondary: #5a32a3;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .breadcrumb-box {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .breadcrumb {
            margin: 0;
            background: transparent;
            padding: 0;
        }

        .breadcrumb-item {
            color: rgba(255,255,255,0.8);
        }

            .breadcrumb-item.active {
                color: #fff;
                font-weight: 600;
            }

            .breadcrumb-item + .breadcrumb-item::before {
                color: rgba(255,255,255,0.6);
                content: ">";
            }

            .breadcrumb-item a {
                color: #fff;
                text-decoration: none;
            }

                .breadcrumb-item a:hover {
                    color: #ffd700;
                }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 20px;
            border-radius: 5px;
            transition: all 0.3s;
        }

            .back-btn:hover {
                background: rgba(255,255,255,0.3);
                transform: translateX(-5px);
            }

        .step {
            display: none;
        }

            .step.active {
                display: block;
                animation: fadeIn 0.5s;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            transition: all 0.3s;
        }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            }

        .major-card {
            cursor: pointer;
            text-align: center;
            padding: 40px 20px;
            color: #fff;
            min-height: 220px;
        }

            .major-card.it {
                background: linear-gradient(135deg, #667eea, #764ba2);
            }

            .major-card.eng {
                background: linear-gradient(135deg, #f093fb, #f5576c);
            }

            .major-card.bus {
                background: linear-gradient(135deg, #4facfe, #00f2fe);
            }

            .major-card i {
                font-size: 60px;
                margin-bottom: 15px;
            }

        .semester-card {
            cursor: pointer;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            min-height: 160px;
        }

            .semester-card i {
                font-size: 40px;
                margin-bottom: 10px;
            }

        .course-box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .class-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-open {
            background: #28a745;
            color: #fff;
        }

        .status-full {
            background: #dc3545;
            color: #fff;
        }

        .status-closed {
            background: #6c757d;
            color: #fff;
        }

        .form-box {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .conflict-alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .day-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .day-checkbox {
            display: none;
        }

        .day-label {
            padding: 8px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            background: #fff;
        }

        .day-checkbox:checked + .day-label {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .day-label:hover {
            border-color: var(--primary);
        }

        .time-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .schedule-preview {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            font-weight: 500;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1400px;">
        <!-- Breadcrumb -->
        <div class="breadcrumb-box">
            <button class="back-btn" id="backBtn" style="display: none;">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <nav style="margin-top: 10px;">
                <ol class="breadcrumb" id="breadcrumb"></ol>
            </nav>
        </div>

        <!-- STEP 1: Select Major -->
        <div id="step1" class="step active">
            <h2 class="text-white text-center mb-4">Select Major</h2>
            <div class="row g-4" id="majorGrid"></div>
        </div>

        <!-- STEP 2: Select Semester -->
        <div id="step2" class="step">
            <h2 class="text-white text-center mb-4">Select Semester</h2>
            <div class="row g-4" id="semesterGrid"></div>
        </div>

        <!-- STEP 3: Select Course & View Classes -->
        <div id="step3" class="step">
            <h2 class="text-white text-center mb-4">Course List</h2>
            <div id="courseList"></div>
        </div>

        <!-- STEP 4: Create/Edit Form -->
        <div id="step4" class="step">
            <div class="form-box">
                <h3 class="mb-4" id="formTitle">Create New Class</h3>
                <form id="classForm">
                    <input type="hidden" id="classId">
                    <input type="hidden" id="schedule">

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Major</label>
                            <input type="text" class="form-control bg-light" id="majorDisplay" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Semester</label>
                            <input type="text" class="form-control bg-light" id="semesterDisplay" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Course</label>
                            <input type="text" class="form-control bg-light" id="courseDisplay" readonly>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Class Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="className"
                                   placeholder="IT101-A" required pattern="^[A-Z]{2,6}\d{3}-[A-Z]$">
                            <small class="text-muted">Format: IT101-A</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Instructor</label>
                            <select class="form-select" id="instructorId">
                                <option value="">-- Not Assigned --</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Schedule <span class="text-danger">*</span></label>

                            <div class="day-selector">
                                <input type="checkbox" class="day-checkbox" id="dayMon" value="Mon">
                                <label for="dayMon" class="day-label">Monday</label>

                                <input type="checkbox" class="day-checkbox" id="dayTue" value="Tue">
                                <label for="dayTue" class="day-label">Tuesday</label>

                                <input type="checkbox" class="day-checkbox" id="dayWed" value="Wed">
                                <label for="dayWed" class="day-label">Wednesday</label>

                                <input type="checkbox" class="day-checkbox" id="dayThu" value="Thu">
                                <label for="dayThu" class="day-label">Thursday</label>

                                <input type="checkbox" class="day-checkbox" id="dayFri" value="Fri">
                                <label for="dayFri" class="day-label">Friday</label>

                                <input type="checkbox" class="day-checkbox" id="daySat" value="Sat">
                                <label for="daySat" class="day-label">Saturday</label>

                                <input type="checkbox" class="day-checkbox" id="daySun" value="Sun">
                                <label for="daySun" class="day-label">Sunday</label>
                            </div>

                            <div class="time-inputs">
                                <div>
                                    <label class="form-label">Start Time</label>
                                    <input type="time" class="form-control" id="startTime" required>
                                </div>
                                <span class="mt-4">-</span>
                                <div>
                                    <label class="form-label">End Time</label>
                                    <input type="time" class="form-control" id="endTime" required>
                                </div>
                            </div>

                            <div class="schedule-preview" id="schedulePreview">
                                <i class="fas fa-info-circle"></i> Select days and time
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Room <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="room" placeholder="A101" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Max Students <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="maxStudents" value="45" min="20" max="100" required>
                        </div>
                    </div>

                    <div id="conflictWarning" class="conflict-alert" style="display: none;">
                        <h6><i class="fas fa-exclamation-triangle text-warning"></i> Conflict Warning</h6>
                        <ul id="conflictList" class="mb-0"></ul>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="button" class="btn btn-info" onclick="checkConflicts()">
                            <i class="fas fa-search"></i> Check Conflicts
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> <span id="submitText">Create Class</span>
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="goToStep(3)">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // === STATE ===
        let state = {
            majorId: null,
            majorName: '',
            semesterNum: null,
            semesterId: null,
            courseId: null,
            courseName: '',
            editingId: null,
            instructors: []
        };

        // === INIT ===
        document.addEventListener('DOMContentLoaded', () => {
            loadMajors();
            document.getElementById('classForm').addEventListener('submit', handleSubmit);

            // Listen for schedule changes
            document.querySelectorAll('.day-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', updateSchedulePreview);
            });
            document.getElementById('startTime').addEventListener('change', updateSchedulePreview);
            document.getElementById('endTime').addEventListener('change', updateSchedulePreview);
        });

        // === SCHEDULE BUILDER ===
        function updateSchedulePreview() {
            const selectedDays = [];
            document.querySelectorAll('.day-checkbox:checked').forEach(cb => {
                selectedDays.push(cb.value);
            });

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            const preview = document.getElementById('schedulePreview');

            if (selectedDays.length === 0 || !startTime || !endTime) {
                preview.innerHTML = '<i class="fas fa-info-circle"></i> Select days and time';
                document.getElementById('schedule').value = '';
                return;
            }

            const scheduleStr = `${selectedDays.join(',')} - ${startTime}-${endTime}`;
            document.getElementById('schedule').value = scheduleStr;
            preview.innerHTML = `<i class="fas fa-calendar-check"></i> Schedule: <strong>${scheduleStr}</strong>`;
        }

        function parseSchedule(scheduleStr) {
            // Parse "Mon,Wed - 07:00-09:00" format
            if (!scheduleStr) return;

            const parts = scheduleStr.split(' - ');
            if (parts.length !== 2) return;

            const days = parts[0].split(',');
            const times = parts[1].split('-');

            if (times.length !== 2) return;

            // Reset all checkboxes
            document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);

            // Check selected days
            days.forEach(day => {
                const checkbox = document.querySelector(`.day-checkbox[value="${day.trim()}"]`);
                if (checkbox) checkbox.checked = true;
            });

            // Set times
            document.getElementById('startTime').value = times[0].trim();
            document.getElementById('endTime').value = times[1].trim();

            updateSchedulePreview();
        }

        // === NAVIGATION ===
        function goToStep(num) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${num}`).classList.add('active');
            updateBreadcrumb(num);

            const backBtn = document.getElementById('backBtn');
            backBtn.style.display = num === 1 ? 'none' : 'inline-block';
            backBtn.onclick = () => goToStep(num - 1);
        }

        function updateBreadcrumb(step) {
            let html = '<li class="breadcrumb-item"><a href="#" onclick="goToStep(1)">Home</a></li>';

            if (step >= 1) html += `<li class="breadcrumb-item ${step === 1 ? 'active' : ''}">Class Management</li>`;
            if (step >= 2) html += `<li class="breadcrumb-item ${step === 2 ? 'active' : ''}"><a href="#" onclick="goToStep(2)">${state.majorName}</a></li>`;
            if (step >= 3) html += `<li class="breadcrumb-item ${step === 3 ? 'active' : ''}"><a href="#" onclick="goToStep(3)">Semester ${state.semesterNum}</a></li>`;
            if (step === 4) html += `<li class="breadcrumb-item active">${state.courseName}</li>`;

            document.getElementById('breadcrumb').innerHTML = html;
        }

        // === STEP 1: MAJORS ===
        async function loadMajors() {
            try {
                const res = await fetch('/api/MajorsApi');
                const majors = await res.json();

                const colors = ['it', 'eng', 'bus'];
                const icons = ['fa-laptop-code', 'fa-language', 'fa-briefcase'];

                document.getElementById('majorGrid').innerHTML = majors.map((m, i) => `
                            <div class="col-md-4">
                                <div class="card major-card ${colors[i]}" onclick="selectMajor(${m.majorId}, '${m.majorName}')">
                                    <i class="fas ${icons[i]}"></i>
                                    <h4>${m.majorName}</h4>
                                    <p class="mb-0">${m.majorCode}</p>
                                    <small>${m.totalSemesters} semesters - ${m.totalCredits} credits</small>
                                </div>
                            </div>
                        `).join('');
            } catch (err) {
                alert('Error loading majors: ' + err.message);
            }
        }

        function selectMajor(id, name) {
            state.majorId = id;
            state.majorName = name;
            loadSemesters();
            goToStep(2);
        }

        // === STEP 2: SEMESTERS ===
        function loadSemesters() {
            let html = '';
            for (let i = 1; i <= 9; i++) {
                html += `
                            <div class="col-md-4">
                                <div class="card semester-card" onclick="selectSemester(${i})">
                                    <i class="fas fa-calendar-alt"></i>
                                    <h5>Semester ${i}</h5>
                                    <small>Year ${Math.ceil(i / 3)}</small>
                                </div>
                            </div>
                        `;
            }
            document.getElementById('semesterGrid').innerHTML = html;
        }

        async function selectSemester(num) {
            state.semesterNum = num;

            try {
                const res = await fetch('/api/SemestersApi');
                const semesters = await res.json();
                const semester = semesters.find(s => s.semesterNumber === num);

                if (semester) {
                    state.semesterId = semester.semesterId;
                    await loadCourses();
                    goToStep(3);
                } else {
                    alert('Semester not found');
                }
            } catch (err) {
                alert('Error loading semester: ' + err.message);
            }
        }

        // === STEP 3: COURSES ===
        async function loadCourses() {
            try {
                const [coursesRes, instructorsRes] = await Promise.all([
                    fetch(`/api/CoursesApi/by-major/${state.majorId}/semester/${state.semesterNum}`),
                    fetch('/api/InstructorsApi')
                ]);

                const courses = await coursesRes.json();
                state.instructors = await instructorsRes.json();

                if (courses.length === 0) {
                    document.getElementById('courseList').innerHTML =
                        '<div class="alert alert-info"><i class="fas fa-info-circle"></i> No courses available</div>';
                    return;
                }

                const coursesWithClasses = await Promise.all(
                    courses.map(async c => {
                        const res = await fetch(`/api/ClassesApi/by-course/${c.courseId}/semester/${state.semesterId}`);
                        const classes = await res.json();
                        return { ...c, classes };
                    })
                );

                renderCourses(coursesWithClasses);
            } catch (err) {
                alert('Error loading courses: ' + err.message);
            }
        }

        function renderCourses(courses) {
            document.getElementById('courseList').innerHTML = courses.map(c => `
                        <div class="course-box">
                            <div class="course-header">
                                <div>
                                    <h5 class="text-primary mb-1">${c.courseCode} - ${c.courseName}</h5>
                                    <span class="badge bg-primary">${c.credits} Credits</span>
                                    <span class="badge bg-success">${c.tuitionFee.toLocaleString()} VND</span>
                                    ${c.prerequisiteCourseName ? `<span class="badge bg-warning text-dark">Prerequisite: ${c.prerequisiteCourseName}</span>` : ''}
                                </div>
                                <button class="btn btn-primary" onclick="showCreateForm(${c.courseId}, '${c.courseName}')">
                                    <i class="fas fa-plus"></i> Create Class
                                </button>
                            </div>

                            ${c.classes.length > 0 ? `
                                <div>
                                    <h6 class="mb-3">Classes (${c.classes.length})</h6>
                                    ${c.classes.map(cls => `
                                        <div class="class-item">
                                            <div>
                                                <strong>${cls.className}</strong> |
                                                <i class="fas fa-user-tie"></i> ${cls.instructorName} |
                                                <i class="fas fa-clock"></i> ${cls.schedule} |
                                                <i class="fas fa-door-open"></i> ${cls.room} |
                                                <i class="fas fa-users"></i> ${cls.currentEnrollment}/${cls.maxStudents} |
                                                <span class="status-badge status-${cls.status.toLowerCase()}">${cls.status}</span>
                                            </div>
                                            <div>
                                                <button class="btn btn-sm btn-info" onclick="editClass(${cls.classId})">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button class="btn btn-sm btn-danger" onclick="deleteClass(${cls.classId}, '${cls.className}')">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<p class="text-muted">No classes available</p>'}
                        </div>
                    `).join('');
        }

        // === STEP 4: FORM ===
        function showCreateForm(courseId, courseName) {
            state.courseId = courseId;
            state.courseName = courseName;
            state.editingId = null;

            document.getElementById('classForm').reset();
            document.getElementById('classId').value = '';
            document.getElementById('schedule').value = '';
            document.getElementById('formTitle').textContent = 'Create New Class';
            document.getElementById('submitText').textContent = 'Create Class';

            document.getElementById('majorDisplay').value = state.majorName;
            document.getElementById('semesterDisplay').value = `Semester ${state.semesterNum}`;
            document.getElementById('courseDisplay').value = courseName;

            const select = document.getElementById('instructorId');
            select.innerHTML = '<option value="">-- Not Assigned --</option>' +
                state.instructors.map(i => `<option value="${i.instructorId}">${i.fullName} - ${i.specialization}</option>`).join('');

            document.getElementById('conflictWarning').style.display = 'none';

            // Reset schedule picker
            document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            updateSchedulePreview();

            goToStep(4);
        }

        async function editClass(id) {
            try {
                const res = await fetch(`/api/ClassesApi/${id}`);
                const cls = await res.json();

                state.editingId = id;
                state.courseId = cls.courseId;
                state.courseName = cls.courseName;

                document.getElementById('classId').value = cls.classId;
                document.getElementById('className').value = cls.className;
                document.getElementById('instructorId').value = cls.instructorId || '';
                document.getElementById('room').value = cls.room;
                document.getElementById('maxStudents').value = cls.maxStudents;

                document.getElementById('majorDisplay').value = state.majorName;
                document.getElementById('semesterDisplay').value = `Semester ${state.semesterNum}`;
                document.getElementById('courseDisplay').value = cls.courseName;

                const select = document.getElementById('instructorId');
                select.innerHTML = '<option value="">-- Not Assigned --</option>' +
                    state.instructors.map(i => `<option value="${i.instructorId}">${i.fullName} - ${i.specialization}</option>`).join('');
                select.value = cls.instructorId || '';

                document.getElementById('formTitle').textContent = 'Edit Class';
                document.getElementById('submitText').textContent = 'Update';
                document.getElementById('conflictWarning').style.display = 'none';

                // Parse and set schedule
                parseSchedule(cls.schedule);

                goToStep(4);
            } catch (err) {
                alert('Error loading class: ' + err.message);
            }
        }

        async function checkConflicts() {
            const instructorId = document.getElementById('instructorId').value;
            const schedule = document.getElementById('schedule').value;
            const room = document.getElementById('room').value;

            if (!schedule || !room) {
                alert('Please select schedule days/time and room');
                return;
            }

            try {
                const res = await fetch('/api/ClassesApi/check-conflicts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instructorId: instructorId || null,
                        semesterId: state.semesterId,
                        schedule,
                        room,
                        excludeClassId: state.editingId
                    })
                });

                const result = await res.json();
                const warning = document.getElementById('conflictWarning');
                const list = document.getElementById('conflictList');

                if (result.hasConflict) {
                    list.innerHTML = result.conflicts.map(c => `<li>${c}</li>`).join('');
                    warning.style.display = 'block';
                } else {
                    warning.style.display = 'none';
                    alert('? No conflicts detected!');
                }
            } catch (err) {
                alert('Error checking conflicts: ' + err.message);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const schedule = document.getElementById('schedule').value;
            if (!schedule) {
                alert('Please select schedule days and time');
                return;
            }

            const data = {
                className: document.getElementById('className').value,
                courseId: state.courseId,
                semesterId: state.semesterId,
                instructorId: document.getElementById('instructorId').value || null,
                schedule: schedule,
                room: document.getElementById('room').value,
                maxStudents: parseInt(document.getElementById('maxStudents').value),
                status: 'Open'
            };

            try {
                const url = state.editingId ? `/api/ClassesApi/${state.editingId}` : '/api/ClassesApi';
                const method = state.editingId ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(state.editingId ? '? Updated successfully!' : '? Class created successfully!');
                    await loadCourses();
                    goToStep(3);
                } else {
                    const err = await res.json();
                    alert('? ' + (err.message || 'Error saving class'));
                }
            } catch (err) {
                alert('? Error: ' + err.message);
            }
        }

        async function deleteClass(id, name) {
            if (!confirm(`Delete class ${name}?`)) return;

            try {
                const res = await fetch(`/api/ClassesApi/${id}`, { method: 'DELETE' });

                if (res.ok) {
                    alert('? Deleted successfully!');
                    await loadCourses();
                } else {
                    const err = await res.json();
                    alert('? ' + (err.message || 'Error deleting'));
                }
            } catch (err) {
                alert('? Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
